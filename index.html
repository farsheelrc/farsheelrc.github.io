<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }
        .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .form-container {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="number"] {
            width: 100px;
            display: inline-block;
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .inline-group label {
            margin-bottom: 0;
        }
        .inline-group select {
            width: 150px;
        }
        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .save-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
        }
        .cancel-btn {
            background-color: transparent;
            color: #007bff;
            border: none;
            text-decoration: underline;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .checkbox-group label {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>Tax Calculator</h1>
    <div class="description">Calculate tax based on your configuration</div>
    <div class="form-container">
        <div class="form-group">
            <label for="price">Price ($)</label>
            <input type="number" id="price" value="0" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="calculationType">Calculation Type</label>
            <select id="calculationType">
                <option value="inclusive">Tax-Inclusive (Reverse Calculate Tax)</option>
                <option value="exclusive">Tax-Exclusive (Calculate Tax and Total)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="taxName">Name</label>
            <input type="text" id="taxName" value="">
        </div>

        <!-- Tax Rate 1 -->
        <div class="form-group">
            <label for="taxLabel1">Tax Label 1</label>
            <input type="text" id="taxLabel1" value="Tax 1">
        </div>
        <div class="form-group inline-group">
            <label>Rate 1</label>
            <span>%</span>
            <input type="number" id="taxRate1" value="0" step="0.1" min="0">
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 1 if over this amount</label>
            <span>$</span>
            <input type="number" id="taxThreshold1" value="0" step="0.01" min="0">
            <label>Apply to</label>
            <select id="taxApply1">
                <option value="amountOver">Amount Over</option>
                <option value="fullAmount">Full Amount</option>
            </select>
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 1 up to this amount</label>
            <span>$</span>
            <input type="number" id="taxLimit1" value="0" step="0.01" min="0">
        </div>

        <!-- Tax Rate 2 -->
        <div class="form-group">
            <label for="taxLabel2">Tax Label 2</label>
            <input type="text" id="taxLabel2" placeholder="Enter a tax label">
        </div>
        <div class="form-group inline-group">
            <label>Rate 2</label>
            <span>%</span>
            <input type="number" id="taxRate2" value="0" step="0.1" min="0">
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 2 if over this amount</label>
            <span>$</span>
            <input type="number" id="taxThreshold2" value="0" step="0.01" min="0">
            <label>Apply to</label>
            <select id="taxApply2">
                <option value="fullAmount">Full Amount</option>
                <option value="amountOver">Amount Over</option>
            </select>
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 2 up to this amount</label>
            <span>$</span>
            <input type="number" id="taxLimit2" value="0" step="0.01" min="0">
        </div>

        <!-- Tax Rate 3 -->
        <div class="form-group">
            <label for="taxLabel3">Tax Label 3</label>
            <input type="text" id="taxLabel3" placeholder="Enter a tax label">
        </div>
        <div class="form-group inline-group">
            <label>Rate 3</label>
            <span>%</span>
            <input type="number" id="taxRate3" value="0" step="0.1" min="0">
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 3 if over this amount</label>
            <span>$</span>
            <input type="number" id="taxThreshold3" value="0" step="0.01" min="0">
            <label>Apply to</label>
            <select id="taxApply3">
                <option value="fullAmount">Full Amount</option>
                <option value="amountOver">Amount Over</option>
            </select>
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 3 up to this amount</label>
            <span>$</span>
            <input type="number" id="taxLimit3" value="0" step="0.01" min="0">
        </div>

        <!-- Tax Rate 4 -->
        <div class="form-group">
            <label for="taxLabel4">Tax Label 4</label>
            <input type="text" id="taxLabel4" placeholder="Enter a tax label">
        </div>
        <div class="form-group inline-group">
            <label>Rate 4</label>
            <span>%</span>
            <input type="number" id="taxRate4" value="0" step="0.1" min="0">
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 4 if over this amount</label>
            <span>$</span>
            <input type="number" id="taxThreshold4" value="0" step="0.01" min="0">
            <label>Apply to</label>
            <select id="taxApply4">
                <option value="fullAmount">Full Amount</option>
                <option value="amountOver">Amount Over</option>
            </select>
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 4 up to this amount</label>
            <span>$</span>
            <input type="number" id="taxLimit4" value="0" step="0.01" min="0">
        </div>

        <!-- Tax Rate 5 -->
        <div class="form-group">
            <label for="taxLabel5">Tax Label 5</label>
            <input type="text" id="taxLabel5" placeholder="Enter a tax label">
        </div>
        <div class="form-group inline-group">
            <label>Rate 5</label>
            <span>%</span>
            <input type="number" id="taxRate5" value="0" step="0.1" min="0">
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 5 if over this amount</label>
            <span>$</span>
            <input type="number" id="taxThreshold5" value="0" step="0.01" min="0">
            <label>Apply to</label>
            <select id="taxApply5">
                <option value="fullAmount">Full Amount</option>
                <option value="amountOver">Amount Over</option>
            </select>
        </div>
        <div class="form-group inline-group">
            <label>Apply Tax Rate 5 up to this amount</label>
            <span>$</span>
            <input type="number" id="taxLimit5" value="0" step="0.01" min="0">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="compounded">
            <label for="compounded">Compounded</label>
        </div>

        <div class="buttons">
            <button class="save-btn" onclick="calculateTax()">Calculate</button>
            <button class="cancel-btn" onclick="resetForm()">Cancel</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function calculateTax() {
            // Get input values
            const price = parseFloat(document.getElementById('price').value);
            const calculationType = document.getElementById('calculationType').value;
            const resultDiv = document.getElementById('result');

            // Get tax configuration for up to 5 rates
            const taxRates = [
                parseFloat(document.getElementById('taxRate1').value) / 100,
                parseFloat(document.getElementById('taxRate2').value) / 100,
                parseFloat(document.getElementById('taxRate3').value) / 100,
                parseFloat(document.getElementById('taxRate4').value) / 100,
                parseFloat(document.getElementById('taxRate5').value) / 100
            ];
            const taxThresholds = [
                parseFloat(document.getElementById('taxThreshold1').value),
                parseFloat(document.getElementById('taxThreshold2').value),
                parseFloat(document.getElementById('taxThreshold3').value),
                parseFloat(document.getElementById('taxThreshold4').value),
                parseFloat(document.getElementById('taxThreshold5').value)
            ];
            const taxLimits = [
                parseFloat(document.getElementById('taxLimit1').value),
                parseFloat(document.getElementById('taxLimit2').value),
                parseFloat(document.getElementById('taxLimit3').value),
                parseFloat(document.getElementById('taxLimit4').value),
                parseFloat(document.getElementById('taxLimit5').value)
            ];
            const taxApply = [
                document.getElementById('taxApply1').value,
                document.getElementById('taxApply2').value,
                document.getElementById('taxApply3').value,
                document.getElementById('taxApply4').value,
                document.getElementById('taxApply5').value
            ];
            const compounded = document.getElementById('compounded').checked;

            let preTaxAmount, totalTax, totalAmount;

            if (calculationType === 'inclusive') {
                // Reverse calculate for tax-inclusive price
                if (!compounded) {
                    // Non-compounded: Iterative approximation for multiple rates
                    let low = 0, high = price * 2;
                    for (let i = 0; i < 100; i++) { // Newton-Raphson-like iteration
                        preTaxAmount = (low + high) / 2;
                        let calculatedTax = 0;
                        for (let j = 0; j < 5; j++) {
                            if (preTaxAmount > taxThresholds[j] && taxRates[j] > 0) {
                                if (taxApply[j] === 'amountOver') {
                                    const taxableAmount = (taxLimits[j] === 0 || preTaxAmount <= taxLimits[j]) 
                                        ? (preTaxAmount - taxThresholds[j]) 
                                        : (taxLimits[j] - taxThresholds[j]);
                                    calculatedTax += taxRates[j] * taxableAmount;
                                } else {
                                    calculatedTax += taxRates[j] * preTaxAmount;
                                }
                            }
                        }
                        const total = preTaxAmount + calculatedTax;
                        if (total > price) high = preTaxAmount;
                        else low = preTaxAmount;
                    }
                    preTaxAmount = (low + high) / 2;
                } else {
                    resultDiv.innerHTML = 'Compounded tax reverse calculation not supported yet.';
                    return;
                }

                // Calculate tax based on thresholds
                totalTax = 0;
                for (let j = 0; j < 5; j++) {
                    if (preTaxAmount > taxThresholds[j] && taxRates[j] > 0) {
                        if (taxApply[j] === 'amountOver') {
                            const taxableAmount = (taxLimits[j] === 0 || preTaxAmount <= taxLimits[j]) 
                                ? (preTaxAmount - taxThresholds[j]) 
                                : (taxLimits[j] - taxThresholds[j]);
                            totalTax += taxRates[j] * taxableAmount;
                        } else {
                            totalTax += taxRates[j] * preTaxAmount;
                        }
                    }
                }
                totalAmount = price;
            } else {
                // Forward calculate for tax-exclusive price
                preTaxAmount = price;
                totalTax = 0;
                for (let j = 0; j < 5; j++) {
                    if (preTaxAmount > taxThresholds[j] && taxRates[j] > 0) {
                        if (taxApply[j] === 'amountOver') {
                            const taxableAmount = (taxLimits[j] === 0 || preTaxAmount <= taxLimits[j]) 
                                ? (preTaxAmount - taxThresholds[j]) 
                                : (taxLimits[j] - taxThresholds[j]);
                            totalTax += taxRates[j] * taxableAmount;
                        } else {
                            totalTax += taxRates[j] * preTaxAmount;
                        }
                    }
                }
                if (compounded) {
                    // Simplified compounding (sequential application)
                    let base = preTaxAmount;
                    for (let j = 0; j < 5; j++) {
                        if (base > taxThresholds[j] && taxRates[j] > 0) {
                            if (taxApply[j] === 'amountOver') {
                                const taxableAmount = (taxLimits[j] === 0 || base <= taxLimits[j]) 
                                    ? (base - taxThresholds[j]) 
                                    : (taxLimits[j] - taxThresholds[j]);
                                base += taxRates[j] * taxableAmount;
                            } else {
                                base += taxRates[j] * base;
                            }
                        }
                    }
                    totalTax = base - preTaxAmount;
                }
                totalAmount = preTaxAmount + totalTax;
            }

            // Round for display
            preTaxAmount = preTaxAmount.toFixed(2);
            totalTax = totalTax.toFixed(2);
            totalAmount = totalAmount.toFixed(2);

            // Display results
            resultDiv.innerHTML = `
                <strong>Results:</strong><br>
                Pre-Tax Amount: $${preTaxAmount}<br>
                Total Tax: $${totalTax}<br>
                Total Amount (with Tax): $${totalAmount}
            `;
        }

        function resetForm() {
            document.getElementById('price').value = '0';
            document.getElementById('calculationType').value = 'inclusive';
            document.getElementById('taxName').value = '';
            document.getElementById('taxLabel1').value = 'Tax 1';
            document.getElementById('taxRate1').value = '0';
            document.getElementById('taxThreshold1').value = '0';
            document.getElementById('taxLimit1').value = '0';
            document.getElementById('taxApply1').value = 'amountOver';
            document.getElementById('taxLabel2').value = '';
            document.getElementById('taxRate2').value = '0';
            document.getElementById('taxThreshold2').value = '0';
            document.getElementById('taxLimit2').value = '0';
            document.getElementById('taxApply2').value = 'fullAmount';
            document.getElementById('taxLabel3').value = '';
            document.getElementById('taxRate3').value = '0';
            document.getElementById('taxThreshold3').value = '0';
            document.getElementById('taxLimit3').value = '0';
            document.getElementById('taxApply3').value = 'fullAmount';
            document.getElementById('taxLabel4').value = '';
            document.getElementById('taxRate4').value = '0';
            document.getElementById('taxThreshold4').value = '0';
            document.getElementById('taxLimit4').value = '0';
            document.getElementById('taxApply4').value = 'fullAmount';
            document.getElementById('taxLabel5').value = '';
            document.getElementById('taxRate5').value = '0';
            document.getElementById('taxThreshold5').value = '0';
            document.getElementById('taxLimit5').value = '0';
            document.getElementById('taxApply5').value = 'fullAmount';
            document.getElementById('compounded').checked = false;
            document.getElementById('result').innerHTML = '';
        }

        // Trigger calculation on page load with default values
        window.onload = calculateTax;
    </script>
</body>
</html>
